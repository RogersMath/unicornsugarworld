<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -36 52 46" width="248" height="192" role="img" aria-label="Athena, a one-winged unicorn, riding a board" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfe3ff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1038c7"/><stop offset="1" stop-color="#a8edff"/>
    </linearGradient>
    <linearGradient id="hg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffba2e"/><stop offset="1" stop-color="#fffae8"/>
    </linearGradient>
    <linearGradient id="brdg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f97"/><stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="bodyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dcd2f2"/>
    </linearGradient>
    <linearGradient id="rbw" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5f8f"/><stop offset=".2" stop-color="#ffa64d"/>
      <stop offset=".4" stop-color="#ffe08a"/><stop offset=".6" stop-color="#8ee8a8"/>
      <stop offset=".8" stop-color="#7ab8ff"/><stop offset="1" stop-color="#c99bff"/>
    </linearGradient>
  </defs>
  <!-- y is flipped: the game's coordinates run up, SVG runs down -->
  <g transform="scale(1,-1)" stroke-linecap="round" stroke-linejoin="round">
    <!-- plum outline under everything -->
    <g stroke="#452348" fill="none">
      <path d="M1.5 11.8 L-20.9 24.4 L-1.5 8.2 Z" stroke-width="6"/>
      <path d="M-10 7.6 L-17.5 5.6 M-11 6.2 L-19 1.8" stroke-width="6.5"/>
      <path d="M-8 7.2 L-8.2 .9 M-4.1 6.7 L-4.3 .6 M2.7 7 L3.1 .6 M6.4 7.9 L6.7 1" stroke-width="5"/>
      <path d="M4.6 10.4 L10.4 19.6" stroke-width="8"/>
      <path d="M7.6 20.6 L14 20.8 L18.4 20.4 M10.2 23.4 L9.6 27" stroke-width="8"/>
      <path d="M16.8 24.2 L20.5 28 L24.2 31.9" stroke-width="4"/>
      <path d="M2.6 11.4 L8.4 20.6 L10.8 24.4 M11.6 23.8 L14.2 23.2" stroke-width="6"/>
      <ellipse cx="-2.4" cy="9.4" rx="10.6" ry="7.5" transform="rotate(-7 -2.4 9.4)" stroke-width="3.4"/>
      <ellipse cx="-.5" cy="0" rx="19.3" ry="2.6" stroke-width="3.4"/>
      <path d="M-15.5 -1.6 L-16.6 -5.2" stroke-width="4.6"/>
    </g>
    <!-- tail -->
    <path d="M-10 7.6 L-17.5 5.6 M-11 6.2 L-19 1.8" stroke="url(#bg)" stroke-width="4.4" fill="none"/>
    <!-- wing: one wing, held as a sail -->
    <path d="M1.5 11.8 L-20.9 24.4 L-1.5 8.2 Z" fill="url(#wg)" stroke="url(#wg)" stroke-width="2.4"/>
    <path d="M-.5 11.8 L-19.4 17.9 M-.5 10.8 L-14 14.3" fill="none" stroke="#e8f0ff" stroke-width="2.6"/>
    <!-- the rainbow catching the wing's leading edge -->
    <path d="M1.5 11.8 L-20.9 24.4" fill="none" stroke="url(#rbw)" stroke-width="1.6" opacity=".95"/>
    <!-- legs, body, neck, head -->
    <path d="M-8 7.2 L-8.2 .9 M-4.1 6.7 L-4.3 .6 M2.7 7 L3.1 .6 M6.4 7.9 L6.7 1" stroke="#f4eeff" stroke-width="3" fill="none"/>
    <ellipse cx="-2.4" cy="9.4" rx="8.9" ry="6.1" transform="rotate(-7 -2.4 9.4)" fill="url(#bodyg)"/>
    <path d="M4.6 10.4 L10.4 19.6" stroke="#fbf7ff" stroke-width="5.8" fill="none"/>
    <path d="M7.6 20.6 L14 20.8 L18.4 20.4" stroke="#fff" stroke-width="6.6" fill="none"/>
    <path d="M10.2 23.4 L9.6 27" stroke="#fff" stroke-width="2" fill="none"/>
    <!-- mane -->
    <path d="M2.6 11.4 L8.4 20.6 L10.8 24.4" stroke="url(#bg)" stroke-width="4" fill="none"/>
    <path d="M11.6 23.8 L14.2 23.2" stroke="url(#bg)" stroke-width="2.4" fill="none"/>
    <!-- horn -->
    <path d="M16.8 24.2 L20.5 28" stroke="url(#hg)" stroke-width="3" fill="none"/>
    <path d="M20.5 28 L24.2 31.9" stroke="url(#hg)" stroke-width="1.5" fill="none"/>
    <!-- eye -->
    <circle cx="14.4" cy="20.8" r="1.5" fill="#3b1235"/>
    <circle cx="14.7" cy="21.2" r=".55" fill="#fff"/>
    <!-- board and fin -->
    <ellipse cx="-.5" cy="0" rx="19.3" ry="2.6" fill="url(#brdg)"/>
    <path d="M-15.5 -1.6 L-16.6 -5.2" stroke="url(#brdg)" stroke-width="2.4" fill="none"/>
  </g>
</svg>
